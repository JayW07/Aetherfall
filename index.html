<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherfall</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <div class="game-shell">
        <div class="hud">
          <div class="title-wrap">
            <h1>AETHERFALL</h1>
            <p id="levelName">Level 1: Skyfall Meadows</p>
          </div>
          <div class="stats">
            <div class="stat"><span>HP</span><strong id="hpText">100 / 100</strong></div>
            <div class="stat"><span>Objective</span><strong id="shardText">0 / 4</strong></div>
            <div class="stat"><span>Storm</span><strong id="stormText">CALM</strong></div>
            <div class="stat coin-bank"><span>Coin Bank</span><strong id="coinText">🪙 0</strong></div>
          </div>
          <button id="pauseButton" class="icon-button" type="button" title="Pause" aria-label="Pause">⏸</button>
          <button id="fullscreenButton" class="icon-button" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="560" aria-label="Aetherfall game area"></canvas>

          <div id="overlay" class="overlay visible">
            <div class="panel">
              <h2 id="overlayTitle">Skywarden Awakens</h2>
              <p id="overlayText">
                Survive the storm, gather the Echo Shards, and face the Stormheart in a final boss battle on Level 11.
              </p>
              <button id="startButton">Begin the Descent</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="upgrades-panel">
        <h2>Upgrades</h2>
        <p class="upgrades-sub">Spend coins earned from fallen enemies to grow stronger.</p>
        <div id="upgradesList" class="upgrades-list"></div>
      </aside>
    </div>

    <script src="game.js"></script>
  </body>
</html>
